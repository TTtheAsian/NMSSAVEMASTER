appId: com.nmssavemaster.app
productName: "NMS Save Master"
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
asar: true
win:
  target:
    - nsis
    - portable
  icon: build/icon.png
mac:
  target:
    - dmg
  icon: build/icon.png
  category: public.app-category.utilities
linux:
  target:
    - AppImage
  icon: build/icon.png
  category: Utility
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: "NMS Save Master"
portable:
  artifactName: "NMS-Save-Master-Portable.${ext}"
